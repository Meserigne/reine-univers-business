# Réveille l’API Render toutes les minutes (évite le sleep free tier).
name: API Keep-Alive

on:
  schedule:
    - cron: '* * * * *' # chaque minute (peut être un peu retardé par GitHub)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake rub-api
        env:
          API_URL: https://rub-api.onrender.com
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            --max-time 25 \
            -H "User-Agent: rub-keepalive-gha/1.0" \
            "$API_URL/health" || echo "000")
          echo "HTTP $code"
          cat /tmp/health.json || true
          test "$code" = "200"
