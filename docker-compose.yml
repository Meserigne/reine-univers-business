services:
  postgres:
    image: postgres:16-alpine
    container_name: reine-univers-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: reine
      POSTGRES_PASSWORD: reine
      POSTGRES_DB: reine_univers
    volumes:
      - reine_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reine -d reine_univers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reine_pg_data:
